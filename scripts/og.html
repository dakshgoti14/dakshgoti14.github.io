<!DOCTYPE html>
<!-- Social preview template. Rendered to assets/img/og-image.png by `npm run assets`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&display=block">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #060a12; color: #e8edf5; font-family: 'Geist', system-ui, sans-serif;
    padding: 80px 88px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(148,178,224,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,178,224,.07) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 85% 30%, #000 10%, transparent 70%);
  }
  body::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(620px 380px at 10% 0%, rgba(56,140,255,.28), transparent 70%), radial-gradient(560px 360px at 95% 90%, rgba(52,211,153,.18), transparent 70%);
  }
  .top { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
    font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500;
    color: #03121f; background: linear-gradient(100deg, #5ab8ff, #38d6c4 55%, #34d399);
  }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 18px; letter-spacing: .12em; color: #8b8b94; text-transform: uppercase; }
  .eyebrow b { color: #5ab8ff; font-weight: 400; }
  .main { position: relative; z-index: 1; }
  h1 { font-size: 96px; font-weight: 800; letter-spacing: -.05em; line-height: 1; background: linear-gradient(100deg, #f4f8ff 0%, #a8dcff 40%, #5ad8c8 75%, #34d399 100%); -webkit-background-clip: text; color: transparent; padding-bottom: 6px; }
  p { margin-top: 22px; font-size: 40px; letter-spacing: -.025em; line-height: 1.2; color: #8b8b94; max-width: 900px; }
  p em { font-style: normal; color: #ededef; }
  .foot { position: relative; z-index: 1; display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 20px; color: #8b8b94; }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">DG</div>
    <div class="eyebrow"><b>Software Engineer</b> · AI · Backend · Full Stack</div>
  </div>
  <div class="main">
    <h1>Daksh Goti</h1>
    <p>I build <em>scalable systems</em> and <em>AI-powered products</em>.</p>
  </div>
  <div class="foot">
    <span>dakshgoti14.github.io</span>
    <span>Python · Java · React · AWS · GenAI</span>
  </div>
</body>
</html>
