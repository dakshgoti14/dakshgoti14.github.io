<!DOCTYPE html>
<!-- Social preview template. Rendered to assets/img/og-image.png by `npm run assets` (fonts and portrait are local files). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daksh Goti — social preview</title>
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 400 700; src: url(../assets/fonts/space-grotesk-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 400 500; src: url(../assets/fonts/geist-mono-latin.woff2) format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: #16191e; color: #f3f5f8;
    font-family: 'Space Grotesk', system-ui, sans-serif; padding: 60px 72px;
  }
  .copy { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 700; letter-spacing: -.015em; }
  .mark { width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center; background: #2563eb; color: #fff; font-size: 20px; letter-spacing: 0; }
  .rule { display: block; width: 120px; height: 7px; background: #f3f5f8; margin-bottom: 30px; }
  h1 { font-size: 74px; line-height: 1.04; letter-spacing: -.035em; font-weight: 700; }
  p { margin-top: 24px; font-size: 28px; line-height: 1.35; color: #c2c9d3; max-width: 560px; }
  .foot { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .foot b { color: #6ea0ff; }
  .foot span { color: #8f99a8; font-weight: 500; letter-spacing: .02em; text-transform: none; }
  .portrait {
    position: absolute; right: 10px; bottom: -170px; height: 760px;
    -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 92%);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><span class="mark">DG</span>Daksh Goti</div>
    <div>
      <span class="rule"></span>
      <h1>I’m Daksh Goti,<br>a Software<br>Engineer</h1>
      <p>I build scalable systems and AI-powered products.</p>
    </div>
    <div class="foot"><b>/</b> Portfolio <span>dakshgoti14.github.io</span></div>
  </div>
  <img class="portrait" src="../assets/img/portrait-cutout-1040.webp" alt="">
</body>
</html>
